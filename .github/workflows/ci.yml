name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for every job below: these only ever check out the repo and run tests, so the token
# needs to read contents and nothing else. Declared here rather than per job so a job added later cannot
# quietly inherit more than it needs — and so a fork's pull request can never get a writable token.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (eslint + knip + depcruise)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # knip and depcruise both span web/, so resolving web imports needs its deps installed too.
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run lint
      - run: npm run deadcode
      - run: npm run depcruise
      # cs/en dictionary parity + plugin i18n coverage (also runs as part of every build via prebuild).
      - run: npm run languages-check

  daemon:
    name: Daemon (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # tests/tmux/driver.test.ts shells out to tmux; tests/plugins/filesPdf.test.ts shells out to
      # poppler (pdftotext/pdftoppm/pdfinfo) to read real PDFs; tests/plugins/filesPlugin.test.ts
      # shells out to ripgrep (rg) for the Grep tool.
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y tmux poppler-utils ripgrep bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces to AppArmor-profiled binaries, and the
          # bubblewrap package ships no profile of its own — so without this the terminal sandbox is
          # refused with "setting up uid map: Permission denied" and the suite measures a host the
          # product never runs on. Production writes the same profile from provision.sh.
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          PROFILE
          sudo sed -i 's/^          //' /etc/apparmor.d/bwrap
          # Best effort: where AppArmor is absent the probe in sandboxAvailable() reports honestly and
          # the sandbox suites skip, rather than the whole job failing on the environment.
          sudo apparmor_parser -r /etc/apparmor.d/bwrap || true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      # `npm run build` bundles each plugin's browser UI, and those bundles import the web
      # app's libraries (lucide-react, monaco, react-query…). Without the web install they
      # cannot resolve and the build fails before this job reaches what it is here to test.
      - run: npm ci --prefix web
      - run: npm run build
      # tests/scripts/distIntegrity.test.ts drives the real build against the checkout to prove it
      # removes stale output. That is safe on a throwaway runner and destructive on a machine whose
      # daemon is SERVING this directory, so the test only arms itself here.
      - run: npm test
        env:
          ELOWEN_DIST_BUILD_TEST: '1'
      - run: npm run test:cli-tmux:built

  brain-e2e:
    name: Brain E2E (real daemon)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The real daemon boots RealTmuxDriver and runs startup sweeps that shell out to tmux; install it so
      # those best-effort calls don't spew errors during boot.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Boots the ACTUAL built daemon on a throwaway port + temp DB, points its brain at a scripted
      # OpenAI-compatible model server, and drives a real chat turn over HTTP+SSE (auth → start → stream →
      # send → tool call → idle → persisted transcript), plus a teeth check that a provider error surfaces.
      - run: npm ci
      # `npm run build` bundles each plugin's browser UI, and those bundles import the web
      # app's libraries (lucide-react, monaco, react-query…). Without the web install they
      # cannot resolve and the build fails before this job reaches what it is here to test.
      - run: npm ci --prefix web
      - run: npm run build
      - run: node scripts/tests/brain-e2e/chat-turn.mjs
      # The other half of this suite: stopping a turn and killing the session. It exists next to chat-turn
      # and was simply never wired up here, so nothing guarded that path.
      - run: node scripts/tests/brain-e2e/stop-kill.mjs

  # Microsoft Teams is a marketplace plugin, not a bundled core component. Its real-daemon + fake Bot
  # Framework coverage lives beside the code in dragocz95/elowen-plugins (`tests/e2e/msteams/run.mjs`)
  # and is required by that repository's `E2E against the published daemon` CI job.

  api-e2e:
    name: API E2E (REST/SSE/WS contract)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The real daemon boots RealTmuxDriver and runs startup sweeps that shell out to tmux; install it so
      # those best-effort calls don't spew errors during boot.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Boots the ACTUAL built daemon and asserts the auth guard matrix (public routes, setup-mode open,
      # bearer-required after first admin), the SSE stream lifecycle (unauthed reject, authed frames → idle,
      # clean client disconnect), and the WebSocket terminal channel (single-use ws-ticket gate). Teeth:
      # flipping a re-engaged 401 expectation to 200 fails the run.
      - run: npm ci
      # `npm run build` bundles each plugin's browser UI, and those bundles import the web
      # app's libraries (lucide-react, monaco, react-query…). Without the web install they
      # cannot resolve and the build fails before this job reaches what it is here to test.
      - run: npm ci --prefix web
      - run: npm run build
      - run: node scripts/tests/api-e2e/run.mjs

  migration-e2e:
    name: Migration E2E (old-schema DB upgrade)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The real daemon boots RealTmuxDriver and runs startup sweeps that shell out to tmux; install it so
      # those best-effort calls don't spew errors during boot.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Builds an old-schema (user_version 0) SQLite fixture with representative rows, boots the ACTUAL
      # daemon against it, and asserts the migration runner advances the version, upgrades the data
      # (tool-rename maps, prompt-key renames), preserves the pre-existing admin/sessions, and does not
      # re-trigger setup. Teeth: asserting a pre-migration value fails the run.
      - run: npm ci
      # `npm run build` bundles each plugin's browser UI, and those bundles import the web
      # app's libraries (lucide-react, monaco, react-query…). Without the web install they
      # cannot resolve and the build fails before this job reaches what it is here to test.
      - run: npm ci --prefix web
      - run: npm run build
      - run: node scripts/tests/migration-e2e/run.mjs

  web-e2e:
    name: Web E2E (Next standalone + BFF proxy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The real daemon boots RealTmuxDriver and runs startup sweeps that shell out to tmux; install it so
      # those best-effort calls don't spew errors during boot.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Builds both dist/ and the Next standalone (web-dist/), boots the ACTUAL daemon + web server on
      # throwaway ports, and asserts the key app routes serve 200 and the BFF proxy contract (setup-mode
      # tokenless passthrough, first admin via proxy, cookie→Bearer injection, Authorization not forwardable,
      # 401 clears the cookie only when a token was present). Teeth: a dead upstream / broken route fails.
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run build
      - run: npm run build:web
      - run: node scripts/tests/web-e2e/run.mjs

  delegate-e2e:
    name: Delegate E2E (sub-agent + workflow)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The real daemon boots RealTmuxDriver and runs startup sweeps that shell out to tmux; install it so
      # those best-effort calls don't spew errors during boot.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Boots the ACTUAL built daemon and drives a scripted parent turn that emits a Delegate tool call (and a
      # WorkflowStart DAG), asserting the child sub-agent really spawns with the right task, runs its own turn,
      # and its result returns to the parent. Teeth: a non-spawning tool fails the run.
      - run: npm ci
      # `npm run build` bundles each plugin's browser UI, and those bundles import the web
      # app's libraries (lucide-react, monaco, react-query…). Without the web install they
      # cannot resolve and the build fails before this job reaches what it is here to test.
      - run: npm ci --prefix web
      - run: npm run build
      - run: node scripts/tests/delegate-e2e/run.mjs
      # The DAG itself: dependency order, parallel fan-out, resume re-running only what did not finish, and
      # DelegateStop ending a child that would otherwise hang forever. It shares this job's built daemon.
      - run: node scripts/tests/workflow-e2e/run.mjs

  recovery-e2e:
    name: Recovery E2E (delegation restart)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The isolated real daemon uses the same tmux-backed startup path as the other brain E2E suites.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Exercises boot recovery against an actual daemon process restarted over the same throwaway SQLite DB:
      # safe background/foreground respawn, fail-closed unanswered tool calls and the legacy-row migration.
      - run: npm ci
      # `npm run build` bundles each plugin's browser UI, and those bundles import the web
      # app's libraries (lucide-react, monaco, react-query…). Without the web install they
      # cannot resolve and the build fails before this job reaches what it is here to test.
      - run: npm ci --prefix web
      - run: npm run build
      - run: node scripts/tests/recovery-e2e/run.mjs

  web:
    name: Web (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

  install-smoke:
    name: Install smoke (packed tarball in Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Packs the real tarball, installs it in a clean node:22 container and asserts the fresh-install
      # unbox flow (elowen up -> setup-mode API -> first admin -> web serves -> elowen down). Catches
      # packaging/first-run bugs — missing `files`, unbuilt dist/web-dist, mis-pinned deps — that the
      # source-tree jobs above never see. Its in-image `npm install` hits the public registry, so a
      # registry outage (or a genuinely broken fresh install) is what turns this red.
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run test:install

  macos-smoke:
    name: macOS smoke (packed tarball, native launcher)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # The same unboxing contract as install-smoke, but natively on macOS (no Docker on these
      # runners): pack the tarball, install it globally on the clean runner and drive the launcher
      # path (`elowen up` -> setup-mode API -> first admin -> web serves -> `elowen down`) — the exact
      # flow a Mac user hits after `npm install -g elowen`. Also proves the native deps
      # (better-sqlite3, node-pty) resolve on darwin-arm64. tmux mirrors the Linux image's baseline.
      - run: brew install tmux
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run test:install -- --native
